# Local analysis environment (CPU; GPU training uses environment-gpu.yml, D-016).
# Create with:  conda env create -f environment.yml
name: kaggle
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - kaggle
      - pandas
      - pyarrow   # parquet label tables in external datasets
      - numpy
      - scikit-learn
      - pydicom
      - nbformat
      - opencv-python-headless   # local tests of cache notebooks (v07+)
      - torch   # CPU build for local tests of training code: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - timm
      - matplotlib
      - tqdm
      - requests
      # Required by the Claude Code Kaggle plugins (kaggle@shepsci, nvidia-kaggle).
      - kagglehub
      - kagglesdk
      - httpx
      - pydantic
      - python-dotenv
      - rich
      - claude-agent-sdk
